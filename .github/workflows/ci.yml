name: ci

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SYSTEM: '1'
  DEVELOPER_DIR: ${{ vars.XCODE_DEVELOPER_DIR || '/Applications/Xcode.app/Contents/Developer' }}

jobs:
  lint-and-typecheck:
    name: lint + typecheck + go vet
    runs-on: bladerunner-linux
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Lint and typecheck
        run: |
          cd mobile-app && yarn install --immutable && yarn lint && yarn typecheck
          cd ../backend && make vet

  android:
    name: android build
    if: github.event_name == 'push'
    runs-on: bladerunner-linux
    needs: lint-and-typecheck
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/linux-android-toolchain

      - name: Build Android APK
        run: make android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.sha }}
          path: mobile-app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    name: ios build
    if: github.event_name == 'push'
    runs-on: bladerunner-macos
    needs: lint-and-typecheck
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/macos-toolchain

      - name: Clean stale build state
        run: make clean

      - name: Build iOS app
        run: make ios

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: syncup-${{ github.sha }}
          path: mobile-app/ios/build/Build/Products/Release-iphonesimulator/syncup.app
          if-no-files-found: error
          retention-days: 14
